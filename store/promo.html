<!doctype html><meta charset="utf-8"><title>Promo</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(120% 140% at 15% 10%,#3a9bff 0%,#5e5ce6 55%,#2b2a8f 100%);display:flex;align-items:center;justify-content:center;gap:6vw;font-family:-apple-system,system-ui}
  .icon{width:34vh;height:34vh;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
  .page{position:relative;width:46vh;height:46vh}
  .bar{position:absolute;left:0;height:5.2vh;border-radius:2.6vh;background:rgba(255,255,255,.9)}
  .box{position:absolute;border:.5vh dashed;border-radius:1.6vh}
  .dot{position:absolute;top:-2.2vh;left:-2.2vh;width:4.4vh;height:4.4vh;border-radius:50%}
  .g{border-color:#30d158}.g .dot{background:#30d158}
  .y{border-color:#ffd60a}.y .dot{background:#ffd60a}
  .glass{position:absolute;right:-6vh;bottom:-3vh;width:26vh;height:17vh;border-radius:3vh;background:rgba(20,20,26,.45);backdrop-filter:blur(6px) saturate(1.6);box-shadow:inset 1px 1px 0 rgba(255,255,255,.35),inset -1px -1px 0 rgba(255,255,255,.1),0 16px 40px rgba(0,0,0,.35)}
  .glass i{position:absolute;left:3vh;height:2.2vh;border-radius:1.1vh;background:rgba(255,255,255,.8)}
  .glass b{position:absolute;right:3vh;bottom:2.6vh;width:8vh;height:3.6vh;border-radius:1vh;background:rgba(255,255,255,.22)}
</style>
<body>
  <img class="icon" id="icon" alt="">
  <div class="page">
    <div class="bar" style="top:4vh;width:40vh"></div>
    <div class="box g" style="top:1.5vh;left:-2vh;width:44vh;height:10.2vh"><span class="dot"></span></div>
    <div class="bar" style="top:17vh;width:30vh;opacity:.6"></div>
    <div class="bar" style="top:25vh;width:34vh;opacity:.6"></div>
    <div class="bar" style="top:36vh;width:14vh;height:6vh"></div>
    <div class="box y" style="top:34.5vh;left:-1.5vh;width:17vh;height:9vh"><span class="dot"></span></div>
    <div class="glass"><i style="top:3vh;width:14vh"></i><i style="top:7vh;width:18vh;opacity:.6"></i><b></b></div>
  </div>
<script>fetch('icon.svg').catch(()=>{}); document.getElementById('icon').src='icon.svg';</script>
</body>
